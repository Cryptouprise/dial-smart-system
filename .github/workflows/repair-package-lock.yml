name: Repair package lock

# One-time maintenance workflow for restoring package.json/package-lock.json parity.
on:
  push:
    paths:
      - '.github/workflows/repair-package-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Regenerate package lock from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit repaired lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync package lock with package manifest"
          git push
